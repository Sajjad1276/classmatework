name: CI

on:
  push:
    branches: ["main", "phase-0/**", "phase-1/**", "phase-2/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://classmate:local-dev-only@localhost:5432/classmatework
      TEST_POSTGRES_URL: postgresql+asyncpg://classmate:local-dev-only@localhost:5432/classmatework
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classmatework
          POSTGRES_USER: classmate
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classmate -d classmatework"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend tests
      - name: Apply PostgreSQL migrations
        run: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head
      - name: Test
        run: pytest

# Telegram adapter, pairing, FSM-state and idempotency tests run in the backend test suite.
# There is deliberately no Node.js or frontend build in the Telegram-only product.
