services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classmatework
      POSTGRES_USER: classmate
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - classmatework_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classmate -d classmatework"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  admin-bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.bot.main"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://classmate:local-dev-only@postgres:5432/classmatework
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_FSM_TTL_SECONDS: ${BOT_FSM_TTL_SECONDS:-1800}
      BOT_UPDATE_LEASE_SECONDS: ${BOT_UPDATE_LEASE_SECONDS:-180}
      BOT_MESSAGE_RATE_LIMIT: ${BOT_MESSAGE_RATE_LIMIT:-30}
      BOT_CALLBACK_RATE_LIMIT: ${BOT_CALLBACK_RATE_LIMIT:-45}
      BOT_RATE_LIMIT_WINDOW_SECONDS: ${BOT_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://classmate:local-dev-only@postgres:5432/classmatework
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  classmatework_postgres:
